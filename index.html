<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiss Day 💋</title>

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(180deg,#0b1d26,#1b3a4b,#243949);
  color:#fff;
  font-family:'Georgia', serif;
  overflow:hidden;
}

.scene{
  display:none;
  height:100vh;
  padding:30px;
  text-align:center;
}

.scene.active{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

p{
  font-size:20px;
  line-height:1.9;
  margin:10px 0;
}

h1{
  font-size:26px;
  margin:25px 0;
}

button{
  margin-top:35px;
  padding:14px 36px;
  border:none;
  border-radius:40px;
  font-size:18px;
  background:#ffffff;
  color:#243949;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,255,255,0.4);
}

.kiss{
  background:#ff4d6d;
  color:white;
  font-size:22px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

.fade{
  animation:fadeIn 2s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
</audio>

<!-- SCENE 1 -->
<div class="scene active fade" id="scene1">
  <p>🌙 ఈ రాత్రి… నిశ్శబ్దంగా ఉంది</p>
  <p>కానీ నా మనసులో మాత్రం నువ్వే…</p>

  <p>నీ దగ్గర ఉన్నప్పుడు మాటలు అవసరం లేదు…</p>
  <p>ఒక్క క్షణం… ఒక్క ముద్దు చాలూ 💋</p>

  <p>ఆ ముద్దులోనే…</p>
  <p>నా ప్రేమ, నా భద్రత, నా ప్రపంచం ❤️</p>

  <button onclick="nextScene()">Next ▶️</button>
</div>

<!-- SCENE 2 -->
<div class="scene fade" id="scene2">
  <p>🌸 దగ్గరగా రా…</p>
  <p>ఈ క్షణాన్ని మాటలతో కాదు…</p>
  <p>మన హృదయాలతో పంచుకుందాం…</p>

  <h1>Can I steal a kiss? 💋</h1>

  <button class="kiss" onclick="kissMoment()">Yes 💖</button>
</div>

<canvas id="fireworks"></canvas>

<script>
const music = document.getElementById("music");

function nextScene(){
  music.play();
  document.getElementById("scene1").classList.remove("active");
  document.getElementById("scene2").classList.add("active");
}

function kissMoment(){
  if(navigator.vibrate){
    navigator.vibrate([150,80,150]);
  }
  startFireworks();
}

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let particles=[];

function startFireworks(){
  for(let i=0;i<140;i++){
    particles.push({
      x:canvas.width/2,
      y:canvas.height/2,
      vx:(Math.random()-0.5)*6,
      vy:(Math.random()-0.5)*6,
      life:100,
      color:`hsl(${Math.random()*360},90%,70%)`
    });
  }
  animate();
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach((p,i)=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,2.3,0,Math.PI*2);
    ctx.fill();
    if(p.life<=0) particles.splice(i,1);
  });
  if(particles.length>0) requestAnimationFrame(animate);
}
</script>

</body>
</html>
