<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiss Day 💋</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
  overflow: hidden;
  font-family: 'Playfair Display', serif;
  color: white;
}

.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  width: 90%;
}

.subtitle {
  font-size: 22px;
  opacity: 0;
  animation: fadeIn 3s forwards;
}

.subtitle:nth-child(2) { animation-delay: 3s; }
.subtitle:nth-child(3) { animation-delay: 6s; }
.subtitle:nth-child(4) { animation-delay: 9s; }

@keyframes fadeIn {
  to { opacity: 1; }
}

button {
  margin-top: 30px;
  padding: 14px 30px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  background: crimson;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255,0,0,0.6);
  display: none;
}

#kiss {
  font-size: 50px;
  margin-top: 20px;
  display: none;
  animation: pop 1s infinite alternate;
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.2); }
}

/* Rain */
.rain {
  position: absolute;
  width: 2px;
  height: 100px;
  background: rgba(255,255,255,0.2);
  animation: fall linear infinite;
}

@keyframes fall {
  from { top: -100px; }
  to { top: 100vh; }
}
</style>
</head>

<body>

<div class="center">
  <div class="subtitle">🌧️ Background rain… slow music…</div>
  <div class="subtitle">She looks at you… You look at her…</div>
  <div class="subtitle">“Ee duniya lo chaala mandhi untaru…”</div>
  <div class="subtitle">“Kani naa universe motham nuvve.”</div>

  <button id="btn" onclick="showKiss()">Come closer 💋</button>
  <div id="kiss">💋</div>
</div>

<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
setTimeout(() => {
  document.getElementById("btn").style.display = "inline-block";
}, 12000);

function showKiss() {
  document.getElementById("kiss").style.display = "block";
}

/* Rain generator */
for (let i = 0; i < 60; i++) {
  let drop = document.createElement("div");
  drop.className = "rain";
  drop.style.left = Math.random() * 100 + "vw";
  drop.style.animationDuration = (Math.random() * 1 + 0.5) + "s";
  document.body.appendChild(drop);
}
</script>

</body>
</html>
